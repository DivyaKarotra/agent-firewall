name: "Keep demo awake"

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

env:
  APP_URL: "https://agent-firewall.streamlit.app/"

permissions:
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit app and keep awake
        run: |
          python - << 'EOF'
          import os
          import sys
          import time
          from playwright.sync_api import sync_playwright

          app_url = os.environ.get("APP_URL", "https://agent-firewall.streamlit.app/")
          print(f"Navigating to {app_url}...")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context()
              page = context.new_page()

              try:
                  page.goto(app_url, wait_until="domcontentloaded", timeout=120000)
              except Exception as e:
                  print(f"Initial navigation exception: {e}")

              def _check_iframe_content(iframe_timeout=120000):
                  """Wait for the Streamlit iframe then look for app text inside it."""
                  # Streamlit Community Cloud renders the app inside an iframe
                  page.wait_for_selector('iframe[title="streamlitApp"]', timeout=iframe_timeout)
                  frame = page.frame_locator('iframe[title="streamlitApp"]')
                  frame.get_by_text("AgentFirewall").first.wait_for(timeout=120000)

              # Wait for the Streamlit iframe and its content.
              # If the wake button was just clicked the app may still be restarting,
              # so retry once if the first attempt fails.
              content_loaded = False
              for attempt in (1, 2):
                  try:
                      # Wait until EITHER the app iframe OR the wake button is present, up to 90 s
                      start = time.time()
                      state = None
                      while time.time() - start < 90:
                          if page.locator('iframe[title="streamlitApp"]').count() > 0:
                              state = "awake"
                              break
                          elif page.get_by_role("button", name="Yes, get this app back up!").count() > 0:
                              state = "asleep"
                              break
                          time.sleep(1)

                      if state == "asleep":
                          wake_button = page.get_by_role("button", name="Yes, get this app back up!")
                          wake_button.wait_for(state="visible", timeout=10000)
                          wake_button.click()
                          print("App was asleep; woke it")
                          _check_iframe_content(iframe_timeout=180000)
                      elif state == "awake":
                          print("App already awake")
                          _check_iframe_content(iframe_timeout=120000)
                      else:
                          raise TimeoutError("Timed out waiting 90 s for iframe or wake button")

                      content_loaded = True
                      break
                  except Exception as e:
                      print(f"Attempt {attempt}: iframe content check failed: {e}")
                      if attempt == 1:
                          print("Retrying after 5 s (app may still be restarting)...")
                          time.sleep(5)

              # Stay about 20 s to let the WebSocket session register
              time.sleep(20)

              if content_loaded:
                  print("OK: app content loaded inside Streamlit iframe")
              else:
                  print(
                      f"WARNING: content never loaded. "
                      f"Current title: '{page.title()}' | "
                      f"Body excerpt: {page.inner_text('body')[:300]!r}"
                  )
                  browser.close()
                  sys.exit(1)

              browser.close()
          EOF
